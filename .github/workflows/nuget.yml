name: NuGet Build and Pack

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/HelloWorldLib/HelloWorldLib.csproj
      
    - name: Build
      run: dotnet build src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-restore
      
    - name: Test
      run: dotnet test src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-build --verbosity normal
      continue-on-error: true
      
    - name: Pack
      run: dotnet pack src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-build -o ./artifacts
      
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
        retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/HelloWorldLib/HelloWorldLib.csproj
      
    - name: Build
      run: dotnet build src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-restore
      
    - name: Pack
      run: dotnet pack src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-build -o ./artifacts
      
    - name: Publish to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
