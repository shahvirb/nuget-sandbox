name: NuGet Build and Pack

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/HelloWorldLib/HelloWorldLib.csproj
      
    - name: Build
      run: dotnet build src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-restore
      
    - name: Test
      run: dotnet test src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-build --verbosity normal
      continue-on-error: true
      
    - name: Pack
      run: dotnet pack src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-build -o ./artifacts
      
    - name: Upload NuGet package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
        retention-days: 30
    
    - name: Generate job summary
      run: |
        echo "## 📦 NuGet Package Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download the NuGet Package" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The NuGet package has been successfully built and uploaded as an artifact." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**To download:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to the [workflow run page](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "2. Scroll down to the **Artifacts** section at the bottom" >> $GITHUB_STEP_SUMMARY
        echo "3. Click on **nuget-package** to download the .nupkg file" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📄 Package Details" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Name:** HelloWorldLib" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Configuration:** Release" >> $GITHUB_STEP_SUMMARY
        echo "- **Output Location (in workflow):** \`./artifacts/\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Retention Period:** 30 days" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        PACKAGE_FILE=$(find ./artifacts -name '*.nupkg' -type f -print -quit)
        if [ -n "$PACKAGE_FILE" ]; then
          PACKAGE_NAME=$(basename "$PACKAGE_FILE")
          PACKAGE_SIZE=$(du -h "$PACKAGE_FILE" | cut -f1)
          echo "- **Package File:** \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Size:** $PACKAGE_SIZE" >> $GITHUB_STEP_SUMMARY
        fi

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/HelloWorldLib/HelloWorldLib.csproj
      
    - name: Build
      run: dotnet build src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-restore
      
    - name: Pack
      run: dotnet pack src/HelloWorldLib/HelloWorldLib.csproj -c Release --no-build -o ./artifacts
      
    - name: Publish to NuGet.org
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
